Practical 1 – Change Student Name

HTML
<h2 id="student">Student Name</h2>
<button id="changeBtn">Change Name</button>

jQuery
$("#changeBtn").click(function () {
    $("#student").text("Adithya");
});


Practical 2 – Get User Input
<input type="text" id="name">
<button id="btn">Display</button>
<h2 id="result"></h2>

$("#btn").click(function () {
    let name = $("#name").val();
    $("#result").text("Welcome " + name);
});

Flow
User enters name
       ↓
Click button
       ↓
.val()
       ↓
Get input
       ↓
.text()
       ↓
Display result

Practical 3 – Dynamic Student List
<input type="text" id="studentName">
<button id="addBtn">Add Student</button>
<ul id="studentList"></ul>

$("#addBtn").click(function () {
    let name = $("#studentName").val();
    $("#studentList").append(
        "<li>" + name + "</li>"
    );
    $("#studentName").val("");
});

Example
User enters:
Rahul
Click Add Student.
Output:
• Rahul
Then:
• Rahul
• Meera
• Arun

DOM manipulation
🧪 Practical 4 – Add/Delete Students
<input type="text" id="studentName">

<button id="addBtn">Add Student</button>

<ul id="studentList"></ul>
$("#addBtn").click(function () {

    let name = $("#studentName").val();

    $("#studentList").append(
        "<li>" + name + 
        " <button class='delete'>Delete</button></li>"
    );

    $("#studentName").val("");

});
